<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FPS Duel</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <!-- 입장 화면 -->
  <div id="lobby" class="overlay">
    <div class="panel">
      <h1>FPS DUEL</h1>
      <p class="sub">1대1 실시간 대결 · 먼저 5킬 하면 승리</p>
      <label>닉네임 <input id="name" maxlength="16" placeholder="Player"></label>
      <label>방 코드 <input id="room" maxlength="20" placeholder="lobby"></label>
      <button id="joinBtn">입장하기</button>
      <p id="lobbyMsg" class="msg"></p>
      <div class="help">
        <b>조작</b> WASD 이동 · 마우스 조준 · 클릭 사격 · Space 점프 · Shift 달리기 · Esc 메뉴<br>
        상대에게 같은 방 코드를 알려주세요. 먼저 들어온 사람이 방장이 되고, 방장이 나가면 게임이 끝납니다.
      </div>
    </div>
  </div>

  <!-- 일시정지/클릭 안내 -->
  <div id="pause" class="overlay hidden">
    <div class="panel small">
      <p id="pauseText">클릭해서 게임 시작</p>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="crosshair"></div>
    <div id="hitmarker"></div>
    <div id="damage"></div>
    <div id="scoreboard"></div>
    <div id="status"></div>
    <div id="feed"></div>
    <div id="center"></div>
    <div id="hpbox"><span>HP</span><div id="hpbar"><div id="hpfill"></div></div><b id="hptext">100</b></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
